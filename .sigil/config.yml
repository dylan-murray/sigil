# Sigil configuration — https://github.com/dylan-murray/sigil
version: 1

model: ollama_chat/deepseek-v4-flash:cloud
boldness: experimental

focus:
  - tests
  - dead_code
  - security
  - docs
  - types
  - features
  - refactoring

max_prs_per_run: 20
max_github_issues: 0
max_ideas_per_run: 100
idea_ttl_days: 180
max_retries: 3
max_parallel_tasks: 5

model_overrides:
  "ollama_chat/deepseek-v4-pro:cloud":
    max_input_tokens: 1048576
    max_output_tokens: 393216
  "ollama_chat/deepseek-v4-flash:cloud":
    max_input_tokens: 1048576
    max_output_tokens: 393216
  "ollama_chat/kimi-k2.6:cloud":
    max_input_tokens: 262144
    max_output_tokens: 32768
  "ollama_chat/glm-5.1:cloud":
    max_input_tokens: 202800
    max_output_tokens: 65500
  "ollama_chat/gemma4:31b-cloud":
    max_input_tokens: 262144
    max_output_tokens: 32768
  "ollama_chat/qwen3.5:397b-cloud":
    max_input_tokens: 262144
    max_output_tokens: 65500
  "ollama_chat/minimax-m2.7:cloud":
    max_input_tokens: 196608
    max_output_tokens: 196608

post_hooks:
  - uv run ruff format .
  - uv run ruff check .
  - uv run pytest tests/unit -x -q

agents:
  ideator:
    - model: ollama_chat/glm-5.1:cloud
    - model: ollama_chat/deepseek-v4-flash:cloud
    # - model: ollama_chat/deepseek-v4-pro:cloud
    - model: ollama_chat/kimi-k2.6:cloud
    - model: ollama_chat/gemma4:31b-cloud
    - model: ollama_chat/qwen3.5:397b-cloud
    - model: ollama_chat/minimax-m2.7:cloud
  architect:
    - model: ollama_chat/glm-5.1:cloud
  engineer:
    - model: ollama_chat/glm-5.1:cloud
  auditor:
    - model: ollama_chat/deepseek-v4-flash:cloud
  triager:
    - model: ollama_chat/glm-5.1:cloud
