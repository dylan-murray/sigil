name: Sigil

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sigil:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # dogfood: intentionally tracks main so the nightly runs the latest action
      - uses: dylan-murray/sigil@main # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
