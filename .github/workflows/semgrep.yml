name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 3"

jobs:
  scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: semgrep scan --config auto --error .
